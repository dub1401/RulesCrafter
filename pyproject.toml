[build-system]
requires = ["uv-build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "RulesCrafter"
version = "0.4.1"
description = "Rules crafting system."
readme = "README.md"
requires-python = ">=3.13"
authors = [
	{ name = "dub1401", email = "vlad.milosta@outlook.com" }
]
dependencies = [
	"dublib>=0.33",
	"dulwich>=1.2.6",
	"flatpak-pip-generator",
	"markdown-pdf",
	"pyqt6",
	"pyqt6-multiselect-combobox",
]

[project.optional-dependencies]
build = [
	"flatpak-pip-generator",
	"pyinstaller", 
	"uv"
]

[project.scripts]
craft = "rulescrafter:main"

[dependency-groups]
dev = [
	"ruff",
	"ty",
	"typos",
]

[tool.uv.sources]
flatpak-pip-generator = { git = "https://github.com/flatpak/flatpak-builder-tools", subdirectory = "pip" }
