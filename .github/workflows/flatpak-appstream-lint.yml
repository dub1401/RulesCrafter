name: Flatpak AppStream linter

on:
  push:
    paths:
      - "flatpak/**"
  pull_request:
    paths:
      - "flatpak/**"

jobs:
  flatpak-appstream-lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-builder-lint:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run AppStream linter
        run: flatpak-builder-lint --gha-format appstream flatpak/io.github.dub1401.RulesCrafter.metainfo.xml
          